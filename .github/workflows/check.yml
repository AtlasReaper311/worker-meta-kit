# Syntax gate with zero dependencies: consumers created from this
# template inherit a working CI baseline on day one.
name: check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0, Node 24
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, Node 24
        with:
          node-version: 22
      - name: node --check every module
        run: npm run check
      - name: Build release artifact dry-run
        run: |
          python3 -m py_compile scripts/build_release.py
          npm run release:pack
